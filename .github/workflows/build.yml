name: Cross-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Windows (MSVC)", os: windows-latest, build_type: "Release" }
          - { name: "Linux (GCC)", os: ubuntu-latest, build_type: "Release" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libglew-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libzint-dev \
            nlohmann-json3-dev pkg-config

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install glfw3 glew zint nlohmann-json --triplet x64-windows

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          fi

      - name: Build Project
        shell: bash
        run: cmake --build build --config ${{ matrix.config.build_type }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}-Binary
          path: |
            build/SBTPC
            build/Release/SBTPC.exe
