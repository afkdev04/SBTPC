name: Cross-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Windows (MSVC)", os: windows-latest, build_type: "Release" }
          - { name: "Linux (GCC)", os: ubuntu-latest, build_type: "Release" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libglew-dev \
            libopengl0-dev \
            libzint-dev \
            libnlohmann-json-dev \
            pkg-config

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}

      - name: Build Project
        run: cmake --build build --config ${{ matrix.config.build_type }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}-Binary
          path: |
            build/SBTPC.exe
            build/SBTPC
            build/Release/SBTPC.exe
